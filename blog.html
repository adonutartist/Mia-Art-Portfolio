<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="favicon.png">
        <meta name="description" content="Read my journal for personal updates, art progress, creative thoughts and more.">
        <title>Journal: Miami</title>
    </head>
    <body>
        <div id="sitecanvas">
            <nav>
                <div class="logo">
                    <a href="index.html">
                        <img src="assets/logos/site_logo.png" alt="Miami">
                    </a>
                </div>
                <ul id="menulist">
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="gallery.html">GALLERY</a></li>
                    <li><a href="blog.html">JOURNAL</a></li>
                    <li><a href="commissions.html">COMMISSIONS</a></li>
                    <li><a href="links.html">LINKS</a></li>
                </ul>
                <div class="menu-icon">
                    <img src="assets/icons/menu_icon.png" alt="Menu" onclick="toggleMenu()">
                </div>
                <script>
                    let menulist = document.getElementById("menulist");
                    menulist.style.maxHeight = "0px";
                    function toggleMenu() {
                        if (menulist.style.maxHeight == "0px") {
                            menulist.style.maxHeight = "360px";
                        }
                        else {
                            menulist.style.maxHeight = "0px";
                        }
                    }
                </script>
            </nav>
            <div class="pagecanvas">
                <div class="pagecontent">
                    <h1 class="blogheader">JOURNAL</h1>
                    <p>
                        Welcome to my little journal!
                        This is where I'll share updates about my art, this wesbite, creative projects,
                        personal thoughts and whatever else I feel like writing about.
                    </p>
                    <hr>
                    <div id="journal-list" class="journal-list">
                        <p id="journal-loading">Loading Journals...</p>
                    </div>
                    <div class="blogcushion"></div>
                    <script>
                        const journalFiles = [
                            "blogposts/first-entry.html",
                            "blogposts/second-entry.html"
                        ];
                        async function loadJournals() {
                            const journalList = document.getElementById("journal-list");
                            const journals = [];
                            for (const file of journalFiles) {
                                try {
                                    const response = await fetch(file);
                                    if (!response.ok) {
                                        throw new Error("Could not load " + file);
                                    }
                                    const html = await response.text();
                                    const doc = new DOMParser().parseFromString(html, "text/html");
                                    const title = doc.querySelector('meta[name="journal-title"]')?.content;
                                    const date = doc.querySelector('meta[name="journal-date"]')?.content;
                                    const preview = doc.querySelector('meta[name="journal-preview"]')?.content;
                                    const cover = doc.querySelector('meta[name="journal-cover"]')?.content;
                                    if (!title || !date || !preview) {
                                        console.warn("Missing journal information:", file);
                                        continue;
                                    }
                                    journals.push({ title, date, preview, cover, url: file});
                                } catch (error) {
                                    console.error(error);
                                }
                            }
                            journals.sort((a, b) => new Date(b.date) - new Date(a.date));
                            journalList.innerHTML = "";
                            if (journals.length === 0) {
                                journalList.innerHTML = `
                                    <div class="blogpostnotice">No entries yet!</div>
                                    <p>I'm still getting things ready around here.
                                    Check back later for new posts :D</p>
                                `;
                                return;
                            }
                            journals.forEach(journal => {
                                const entry = document.createElement("article");
                                entry.className = "journal-card";
                                const link = document.createElement("a");
                                link.href = journal.url;
                                link.className = "journal-link";
                                const content = document.createElement("div");
                                content.className = "journal-preview";
                                const heading = document.createElement("h2");
                                heading.textContent = journal.title;
                                const dateElement = document.createElement("p");
                                dateElement.className = "journal-date";
                                dateElement.textContent = new Date(journal.date + "T00:00:00")
                                    .toLocaleDateString("en-GB", {
                                        day: "numeric",
                                        month: "long",
                                        year: "numeric"
                                    });
                                const description = document.createElement("p");
                                description.className = "journal-description";
                                description.textContent = journal.preview;
                                const readMore = document.createElement("span");
                                readMore.className = "journal-readmore";
                                readMore.textContent = "READ JOURNAL →";
                                content.append(heading, dateElement, description, readMore);
                                link.appendChild(content);
                                if (journal.cover) {
                                    const image = document.createElement("img");
                                    image.src = journal.cover;
                                    image.alt = "";
                                    image.className = "journal-cover";

                                    link.appendChild(image);
                                }
                                entry.appendChild(link);
                                journalList.appendChild(entry);
                            });
                        }
                        loadJournals();
                    </script>
                </div>
            </div>
            <footer>
                <div id="footer">
                    <p>Copyright © 2026 Miami</p>
                </div>
            </footer>
        </div>
    </body>
</html>
